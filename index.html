<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivek | Portfolio</title>

  <!-- Google Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      line-height: 1.6;
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #020617 100%);
      color: #e5e7eb;
    }

    /* NAVBAR */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 10px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(148, 163, 184, 0.4);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .logo span {
      color: #facc15;
    }

    .nav-left a {
      margin: 0 12px;
      text-decoration: none;
      color: #e5e7eb;
      font-size: 0.95rem;
      font-weight: 500;
      position: relative;
      transition: 0.3s;
    }

    .nav-left a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: linear-gradient(to right, #38bdf8, #22c55e);
      transition: width 0.3s;
    }

    .nav-left a:hover {
      color: #facc15;
    }

    .nav-left a:hover::after {
      width: 100%;
    }

    /* HERO SECTION */
    #hero {
      min-height: 100vh;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 80px 40px 60px;
      flex-wrap: wrap;
      gap: 40px;
    }

    .hero-text {
      max-width: 520px;
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.25);
      border: 1px solid rgba(45, 212, 191, 0.5);
      font-size: 0.8rem;
      margin-bottom: 14px;
      color: #a5f3fc;
    }

    .hero-chip i {
      color: #22c55e;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .hero-text h1 span {
      color: #38bdf8;
    }

    .hero-text p {
      font-size: 1rem;
      margin-bottom: 18px;
      color: #cbd5f5;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-primary,
    .btn-outline {
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: 0.25s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(to right, #38bdf8, #22c55e);
      color: #020617;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: #e5e7eb;
      border-color: #38bdf8;
    }

    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
      transform: translateY(-1px);
    }

    .hero-tags {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
    }

    .hero-tags span {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      color: #9ca3af;
    }

    .hero-image img {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(56, 189, 248, 0.8);
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.9);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .hero-image img:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 1);
    }

    /* SECTION BASE */
    section {
      padding: 60px 20px;
    }

    .section-inner {
      max-width: 1000px;
      margin: 0 auto;
    }

    section h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #e5e7eb;
      text-align: center;
    }

    .section-subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    /* ABOUT */
    #about p {
      max-width: 700px;
      margin: 0 auto;
      font-size: 0.98rem;
      color: #d1d5db;
      text-align: center;
    }

    /* SKILLS */
    #skills .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }

    .skill-card {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.8);
      font-size: 0.9rem;
    }

    .skill-card h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    .skill-level {
      width: 100%;
      height: 6px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .skill-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(to right, #38bdf8, #22c55e);
    }

    /* PROJECTS */
    #projects .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .project-card {
      background: rgba(15, 23, 42, 0.95);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.9);
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      text-align: left;
    }

      box-shadow: 0 18px 45px rgba(15, 23, 42,
